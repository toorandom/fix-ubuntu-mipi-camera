# Depuración del cuelgue al hibernar (temporal, quitar cuando se resuelva).
# Una tarea atascada >60s en D state genera un panic, y efi_pstore lo graba en
# la NVRAM: es la única forma de ver dónde colgó, porque journald se congela
# justo en ese paso y el log se corta siempre en el mismo sitio.
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 60
kernel.panic = 20
