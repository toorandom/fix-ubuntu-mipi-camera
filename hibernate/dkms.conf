PACKAGE_NAME="mei-vsc-hibernate"
PACKAGE_VERSION="1.26"
AUTOINSTALL="yes"

MAKE="make KERNEL_SRC=${kernel_source_dir} KERNELRELEASE=${kernelver}"
CLEAN="make KERNEL_SRC=${kernel_source_dir} KERNELRELEASE=${kernelver} clean"

BUILT_MODULE_NAME[0]="ipu-bridge"
BUILT_MODULE_LOCATION[0]="ipu-bridge"
DEST_MODULE_LOCATION[0]="/updates"

BUILT_MODULE_NAME[1]="mei-vsc"
BUILT_MODULE_LOCATION[1]="src"
DEST_MODULE_LOCATION[1]="/updates"

# El sensor lleva un i2c_device_id añadido: sin él, el cliente i2c no-ACPI que
# ipu_bridge instancia tras S4 no enlaza con ningún driver y la cámara no vuelve.
# Tiene que ir en DKMS o un upgrade de kernel se lo lleva por delante.
BUILT_MODULE_NAME[2]="ov02c10"
BUILT_MODULE_LOCATION[2]="ov02c10"
DEST_MODULE_LOCATION[2]="/updates"

# El transporte: aquí vive la puerta de suspensión de vsc_tp, sin la cual los
# clientes del MEI siguen transfiriendo durante la congelación contra un bus
# LJCA ya suspendido (2 s de timeout por intento, reset, reintento).
BUILT_MODULE_NAME[3]="mei-vsc-hw"
BUILT_MODULE_LOCATION[3]="src"
DEST_MODULE_LOCATION[3]="/updates"
